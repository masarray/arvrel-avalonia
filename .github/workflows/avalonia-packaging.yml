name: Avalonia desktop packages

on:
  pull_request:
    paths:
      - "desktop/**"
      - "src/Arvrel.Desktop/**"
      - "src/Arvrel.Application/**"
      - "src/Arvrel.Capture/**"
      - "src/Arvrel.ProcessBus/**"
      - "src/Arvrel.Protection/**"
      - "packaging/avalonia/**"
      - "scripts/package-avalonia-*"
      - "Directory.Build.props"
      - ".github/workflows/avalonia-packaging.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "src/Arvrel.Desktop/**"
      - "src/Arvrel.Application/**"
      - "src/Arvrel.Capture/**"
      - "src/Arvrel.ProcessBus/**"
      - "src/Arvrel.Protection/**"
      - "packaging/avalonia/**"
      - "scripts/package-avalonia-*"
      - "Directory.Build.props"
      - ".github/workflows/avalonia-packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvrel-avalonia-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  ARIEC61850_REF: c1afc68c9931e857eb787b0f249db2c2b0b757c4

jobs:
  prepare:
    name: resolve-package-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout ARVREL Avalonia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve preview version from MSBuild properties
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('Directory.Build.props').getroot()
          values = {child.tag: (child.text or '').strip()
                    for group in root.findall('PropertyGroup')
                    for child in group}
          prefix = values.get('VersionPrefix', '')
          suffix = values.get('VersionSuffix', '')
          if not prefix:
              raise SystemExit('Directory.Build.props does not define VersionPrefix')
          print(prefix + (f'-{suffix}' if suffix else ''))
          PY
          )"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid resolved version: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match v$version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: package-win-x64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout ARVREL Avalonia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: arvrel-avalonia
          persist-credentials: false

      - name: Checkout pinned ARIEC61850 engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: masarray/ARIEC61850
          ref: ${{ env.ARIEC61850_REF }}
          path: ARIEC61850
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows host
        shell: pwsh
        working-directory: arvrel-avalonia/desktop
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish ../src/Arvrel.Desktop/Arvrel.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output ../artifacts/publish/win-x64 `
            -p:Version='${{ needs.prepare.outputs.version }}' `
            -p:HasARIEC61850Sibling=true `
            -p:ARIEC61850Root='${{ github.workspace }}\ARIEC61850' `
            -p:DebugSymbols=false `
            -p:DebugType=None
          if ($LASTEXITCODE -ne 0) {
            throw "Windows self-contained publish failed with exit code $LASTEXITCODE."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows packages
        shell: pwsh
        working-directory: arvrel-avalonia
        run: |
          .\scripts\package-avalonia-windows.ps1 `
            -Version '${{ needs.prepare.outputs.version }}' `
            -PublishDirectory 'artifacts\publish\win-x64' `
            -OutputDirectory 'artifacts\packages\win-x64' `
            -CommitSha '${{ github.sha }}'

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-win-x64
          path: arvrel-avalonia/artifacts/packages/win-x64/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: package-linux-x64
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout ARVREL Avalonia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: arvrel-avalonia
          persist-credentials: false

      - name: Checkout pinned ARIEC61850 engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: masarray/ARIEC61850
          ref: ${{ env.ARIEC61850_REF }}
          path: ARIEC61850
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Linux host
        shell: bash
        working-directory: arvrel-avalonia/desktop
        run: |
          set -euo pipefail
          dotnet publish ../src/Arvrel.Desktop/Arvrel.Desktop.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output ../artifacts/publish/linux-x64 \
            -p:Version='${{ needs.prepare.outputs.version }}' \
            -p:HasARIEC61850Sibling=true \
            -p:ARIEC61850Root='${{ github.workspace }}/ARIEC61850' \
            -p:DebugSymbols=false \
            -p:DebugType=None

      - name: Build Linux packages
        shell: bash
        working-directory: arvrel-avalonia
        run: |
          set -euo pipefail
          bash ./scripts/package-avalonia-linux.sh \
            '${{ needs.prepare.outputs.version }}' \
            'artifacts/publish/linux-x64' \
            'artifacts/packages/linux-x64' \
            '${{ github.sha }}'

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-linux-x64
          path: arvrel-avalonia/artifacts/packages/linux-x64/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: package-osx-arm64
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout ARVREL Avalonia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: arvrel-avalonia
          persist-credentials: false

      - name: Checkout pinned ARIEC61850 engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: masarray/ARIEC61850
          ref: ${{ env.ARIEC61850_REF }}
          path: ARIEC61850
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained macOS host
        shell: bash
        working-directory: arvrel-avalonia/desktop
        run: |
          set -euo pipefail
          dotnet publish ../src/Arvrel.Desktop/Arvrel.Desktop.csproj \
            --configuration Release \
            --runtime osx-arm64 \
            --self-contained true \
            --output ../artifacts/publish/osx-arm64 \
            -p:Version='${{ needs.prepare.outputs.version }}' \
            -p:HasARIEC61850Sibling=true \
            -p:ARIEC61850Root='${{ github.workspace }}/ARIEC61850' \
            -p:DebugSymbols=false \
            -p:DebugType=None

      - name: Build macOS packages
        shell: bash
        working-directory: arvrel-avalonia
        run: |
          set -euo pipefail
          bash ./scripts/package-avalonia-macos.sh \
            '${{ needs.prepare.outputs.version }}' \
            'artifacts/publish/osx-arm64' \
            'artifacts/packages/osx-arm64' \
            '${{ github.sha }}'

      - name: Upload macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-osx-arm64
          path: arvrel-avalonia/artifacts/packages/osx-arm64/*
          if-no-files-found: error
          retention-days: 14

  verify:
    name: verify-package-set
    needs: [prepare, windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-*
          path: packages
          merge-multiple: true

      - name: Verify checksums and expected package set
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          expected=(
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-win-x64-portable.zip"
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-win-x64-setup.exe"
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-linux-x64.tar.gz"
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-linux-x64.deb"
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-osx-arm64.app.zip"
            "ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-osx-arm64.dmg"
          )
          for file in "${expected[@]}"; do
            test -s "$file" || { echo "Missing or empty package artifact: $file" >&2; exit 1; }
          done
          sha256sum --check SHA256SUMS-win-x64.txt
          sha256sum --check SHA256SUMS-linux-x64.txt
          sha256sum --check SHA256SUMS-osx-arm64.txt
          sha256sum ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-* > SHA256SUMS-Avalonia.txt

      - name: Upload verified package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-verified-packages
          path: packages/*
          if-no-files-found: error
          retention-days: 14

  attest:
    name: attest-tagged-packages
    needs: [prepare, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download verified package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ARVREL-Avalonia-v${{ needs.prepare.outputs.version }}-verified-packages
          path: packages

      - name: Attest cross-platform packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/*
